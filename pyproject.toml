[build-system]
requires = ["setuptools>=68.0", "wheel", "cffi>=1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bytetoken"
version = "1.0.0"
description = "Experimental tokenizer-aware binary encoding and context optimization toolkit for AI-agent workflows."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Chandan Pandey"}
]
keywords = [
    "llm", "tokenizer", "bpe", "encoding", "binary",
    "mcp", "model-context-protocol", "agent-context", "token-optimization", "base64",
    "openai", "anthropic", "gemini"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]

dependencies = [
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
sentencepiece = ["sentencepiece>=0.1.99"]
native = ["cffi>=1.0", "numpy>=1.20"]
mcp = ["mcp>=1.0.0"]
all = [
    "sentencepiece>=0.1.99",
    "cffi>=1.0",
    "numpy>=1.20",
]
dev = [
    "pytest>=7.0",
    "sentencepiece>=0.1.99",
    "cffi>=1.0",
    "numpy>=1.20",
]

[project.scripts]
bytetoken = "bytetoken.__main__:main"

[project.urls]
Homepage = "https://github.com/chandanpandeys/bytetoken"
Documentation = "https://github.com/chandanpandeys/bytetoken#readme"
Repository = "https://github.com/chandanpandeys/bytetoken"
Issues = "https://github.com/chandanpandeys/bytetoken/issues"
Paper = "https://github.com/chandanpandeys/bytetoken/blob/main/paper/bytetoken_paper.md"

[tool.setuptools]
# The repository uses a flat package layout: the repository root itself
# is the importable `bytetoken` package.
packages = ["bytetoken"]
package-dir = {"bytetoken" = "."}
include-package-data = true

[tool.setuptools.package-data]
bytetoken = ["*.model", "atom_tables/*.json.gz", "atom_tables/*.json"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["tests.py"]
python_functions = ["test_*"]
