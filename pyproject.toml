[build-system]
requires = ["setuptools>=68.0", "wheel", "cffi>=1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bytetoken"
version = "0.1.0"
description = "Experimental tokenizer-aware binary encoding toolkit for tokenized LLM interfaces."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Chandan Pandey"}]
keywords = ["llm", "tokenizer", "tiktoken", "bpe", "encoding", "binary", "mcp", "agent-context", "base64"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["tiktoken>=0.5.0"]

[project.optional-dependencies]
sentencepiece = ["sentencepiece>=0.1.99"]
native = ["cffi>=1.0", "numpy>=1.20"]
mcp = ["mcp>=1.0.0"]
playground = ["fastapi>=0.115", "uvicorn>=0.30"]
all = ["sentencepiece>=0.1.99", "cffi>=1.0", "numpy>=1.20", "fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=7.0", "sentencepiece>=0.1.99", "cffi>=1.0", "numpy>=1.20", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
bytetoken = "bytetoken.__main__:main"

[project.urls]
Homepage = "https://github.com/chandanpandeys/bytetoken"
Documentation = "https://github.com/chandanpandeys/bytetoken#readme"
Repository = "https://github.com/chandanpandeys/bytetoken"
Issues = "https://github.com/chandanpandeys/bytetoken/issues"
Paper = "https://github.com/chandanpandeys/bytetoken/blob/main/paper/bytetoken_paper.md"

[tool.setuptools]
packages = ["bytetoken", "bytetoken.playground"]
package-dir = {"bytetoken" = ".", "bytetoken.playground" = "playground"}
include-package-data = true

[tool.setuptools.package-data]
bytetoken = ["*.model", "atom_tables/*.json.gz", "atom_tables/*.json"]
"bytetoken.playground" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["tests.py", "tests_publication.py"]
python_functions = ["test_*"]

[tool.vercel]
entrypoint = "bytetoken.playground.app:app"

[tool.vercel.fastapi.static]
cdn = false
