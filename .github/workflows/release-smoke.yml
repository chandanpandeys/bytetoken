name: Release smoke v0.1.0

on:
  push:
    branches: [release-smoke-v0.1.0]

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          ref: v0.1.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "3aaa18b98bfdb4650c0151f42eb7747062baa7db"

      - name: Clean install exactly as README
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      - name: Run README quick start
        shell: bash
        run: |
          python - <<'PY'
          import bytetoken

          payload = b"arbitrary binary data"

          encoded = bytetoken.encode(payload, mode="standard")
          decoded = bytetoken.decode(encoded, mode="standard")

          assert decoded == payload
          print("README quick start: PASS")
          print("ByteToken version:", bytetoken.__version__)
          PY

      - name: Run publication test suites
        run: python -m pytest tests.py tests_publication.py -q

      - name: Run CLI smoke
        run: python -m bytetoken --help
