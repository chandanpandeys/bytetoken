name: Paper

on:
  pull_request:
    branches: [main]
    paths:
      - "paper/**"
      - "!paper/bytetoken_paper.pdf"
      - ".github/workflows/paper.yml"
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "!paper/bytetoken_paper.pdf"
      - ".github/workflows/paper.yml"

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended

      - name: Compile paper
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error bytetoken_paper.tex
          bibtex bytetoken_paper
          pdflatex -interaction=nonstopmode -halt-on-error bytetoken_paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error bytetoken_paper.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: bytetoken-paper
          path: paper/bytetoken_paper.pdf
          if-no-files-found: error

      - name: Publish stable PDF to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/bytetoken_paper.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF is unchanged."
            exit 0
          fi
          git commit -m "docs(paper): refresh compiled PDF"
          git push
