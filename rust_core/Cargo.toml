[package]
name = "bytetoken-native"
version = "0.1.0"
edition = "2021"
description = "Experimental native Rust bit-packing backend for ByteToken"

[lib]
name = "bytetoken_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
crc32fast = "1.4"
numpy = "0.22.0"
